name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/NovaLink.Lumen/NovaLink.Lumen.csproj
      - name: Build
        run: dotnet build src/NovaLink.Lumen/NovaLink.Lumen.csproj -c Release -p:Platform=x64 --no-restore
